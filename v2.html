<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Monitoreo de Ruido</title>
    <!-- Tailwind CSS para diseño moderno y fluido -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Plotly.js para gráficos interactivos de alto rendimiento -->
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<style>
  .dash { font-family: var(--font-sans); padding: 1.5rem; background: #f5f4ee; border-radius: var(--border-radius-lg); min-height: 600px; }
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; }
  .header-left h2 { font-size: 17px; font-weight: 600; color: var(--color-text-primary); margin: 0 0 2px; }
  .header-left p { font-size: 15px; font-weight: 600; color: var(--color-text-primary); margin: 0; }
  .header-right { text-align: right; }
  .header-right p { font-size: 13px; font-weight: 600; color: var(--color-text-primary); margin: 0; line-height: 1.6; }
  .regions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 1rem; }
  .region-btn { padding: 8px 20px; border-radius: 8px; border: 2px solid #7dc54a; background: transparent; color: #3b6d11; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
  .region-btn:hover { background: #c0dd97; }
  .region-btn.active { background: #639922; color: #fff; border-color: #639922; }
  .stations { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 1.5rem; }
  .station-btn { padding: 8px 4px; border-radius: 8px; border: 2px solid #a8e06a; background: #c8f08a; color: #27500a; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; text-align: center; }
  .station-btn:hover { background: #97c459; border-color: #639922; }
  .station-btn.active { background: #639922; color: #fff; border-color: #3b6d11; }
  .tabs { display: flex; gap: 0; margin-bottom: 1.25rem; }
  .tab-btn { padding: 9px 22px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; background: #d1cfc6; color: #5f5e5a; border-radius: 6px 6px 0 0; transition: all 0.15s; margin-right: 4px; }
  .tab-btn.active { background: #2c2c2a; color: #fff; }
  .tab-btn:hover:not(.active) { background: #b4b2a9; }
  .chart-area { background: var(--color-background-primary); border-radius: 0 var(--border-radius-lg) var(--border-radius-lg) var(--border-radius-lg); padding: 1.25rem 1rem 0.75rem; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-bottom: 1rem; justify-content: center; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--color-text-secondary); }
  .legend-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
  .bars-wrap { display: flex; align-items: flex-end; gap: 0; padding-left: 36px; position: relative; height: 220px; }
  .y-axis { position: absolute; left: 0; top: 0; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding-bottom: 22px; }
  .y-label { font-size: 11px; color: var(--color-text-secondary); text-align: right; width: 30px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; justify-content: flex-end; padding: 0 3px; }
  .bar { width: 100%; border-radius: 4px 4px 0 0; position: relative; cursor: pointer; transition: opacity 0.15s; min-width: 12px; }
  .bar:hover { opacity: 0.8; }
  .bar-val { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 600; white-space: nowrap; }
  .bar-label { font-size: 11px; color: var(--color-text-secondary); margin-top: 4px; text-align: center; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .hourly-placeholder { display: flex; align-items: center; justify-content: center; height: 200px; color: var(--color-text-secondary); font-size: 14px; }
</style>

<body>
<div class="dash">
  <h2 class="sr-only">Dashboard de Red de Monitoreo de Ruido Ambiental — selecciona región, estación y pestaña</h2>

  <div class="header">
    <div class="header-left">
      <h2>Red de Monitoreo de Ruido Ambiental</h2>
      <p>Ministerio del Medio Ambiente</p>
    </div>
    <div class="header-right">
      <p>Sección Ruido<br>Departamento de Ruido, Lumínica y Olores</p>
    </div>
  </div>

  <div class="regions" id="regions"></div>
  <div class="stations" id="stations"></div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="ruido">Nivel de Ruido</button>
    <button class="tab-btn" data-tab="horario">Perfil Horario</button>
  </div>

  <div class="chart-area">
    <div id="tab-ruido" class="tab-content active">
      <div class="legend" id="legend"></div>
      <div class="bars-wrap" id="bars-wrap">
        <div class="y-axis" id="y-axis"></div>
      </div>
    </div>
    <div id="tab-horario" class="tab-content">
      <div class="hourly-placeholder">Perfil Horario — selecciona una estación para ver su tendencia</div>
    </div>
  </div>
</div>

<script>
// Data-loading and dynamic UI integration (imported logic from index.html)
const ANNUAL_URL = 'DATA/datos_anuales.csv';
const HOURLY_URL = 'DATA/perfiles_horarios.csv';

let annualData = [];
let hourlyData = [];
let regions = [];
let stationMeta = []; // [{id, val, color}]
let activeRegion = null;
let activeStations = new Set();
let activeStation = null; // single selected station (null = none)

const COLORS = ['#6b8fd8','#a78bd4','#e8a040','#d4c240','#e84080','#d440a0','#40c8c8','#40b878','#78b840','#8a8a20','#c87a18','#e8a080'];

function parseCSV(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l);
  if (!lines.length) return [];
  const headerLine = lines[0];
  const separator = headerLine.includes(';') ? ';' : ',';
  const headers = headerLine.split(separator).map(h => h.trim());
  return lines.slice(1).map(line => {
    const values = line.split(separator).map(v => v.trim());
    return headers.reduce((acc, header, i) => {
      let value = values[i] || '';
      if (/^\d+,\d+$/.test(value)) value = value.replace(',', '.');
      acc[header] = value;
      return acc;
    }, {});
  });
}

function generateMockAnnualCSV() {
  const regions = ['REGION_1','REGION_2','REGION_3'];
  const stations = ['E1','E2','E3','E4','E5','E6'];
  const years = [2023,2024];
  let rows = ['Region;Estacion;Anio;Ruido_dB'];
  regions.forEach((r,ri)=>{
    stations.forEach((s,si)=>{
      years.forEach(y=>{
        const base = 50 + (si*3) + (ri*2);
        const val = (base + (y-2023) + (Math.random()*4-2)).toFixed(1).replace('.',',');
        rows.push(`${r};${s};${y};${val}`);
      });
    });
  });
  return rows.join('\r\n');
}

function generateMockHourlyCSV() {
  const stations = ['E1','E2','E3','E4','E5','E6'];
  const years = [2023,2024];
  const hours = Array.from({length:24},(_,i)=>String(i).padStart(2,'0')+':00');
  let rows = ['Estacion;Anio;Hora;Ruido_dB'];
  stations.forEach((st,si)=>{
    years.forEach(year=>{
      hours.forEach(hora=>{
        const h = parseInt(hora);
        const base = 45 + si*2;
        const curve = base + 10*Math.exp(-0.5*Math.pow((h-8)/3,2)) + 8*Math.exp(-0.5*Math.pow((h-18)/2,2));
        const val = (curve + (Math.random()-0.5)*2).toFixed(1).replace('.',',');
        rows.push(`${st};${year};${hora};${val}`);
      });
    });
  });
  return rows.join('\r\n');
}

async function loadData() {
  // If opened via file://, use mock data to avoid CORS
  if (window.location.protocol === 'file:') {
    const mockA = generateMockAnnualCSV();
    const mockH = generateMockHourlyCSV();
    processData(mockA, mockH);
    return;
  }

  try {
    const [aRes, hRes] = await Promise.all([
      fetch(ANNUAL_URL).then(r=>{ if(!r.ok) throw new Error('annual not found'); return r.text(); }),
      fetch(HOURLY_URL).then(r=>{ if(!r.ok) throw new Error('hourly not found'); return r.text(); })
    ]);
    processData(aRes, hRes);
  } catch (err) {
    console.warn('Fallo fetch CSV, usando datos mock:', err);
    processData(generateMockAnnualCSV(), generateMockHourlyCSV());
  }
}

function processData(annualRaw, hourlyRaw) {
  annualData = parseCSV(annualRaw);
  hourlyData = parseCSV(hourlyRaw);
  regions = [...new Set(annualData.map(d => d.Region))];
  activeRegion = regions[0] || null;
  renderRegions();
  renderStationsForRegion(activeRegion);
  renderChart();
}

function renderRegions(){
  const rEl = document.getElementById('regions');
  rEl.innerHTML = '';
  if (!regions.length) {
    rEl.innerHTML = '<div class="region-btn">No hay regiones</div>';
    return;
  }
  regions.forEach((region, idx)=>{
    const b = document.createElement('button');
    b.className = 'region-btn' + (region===activeRegion ? ' active' : '');
    b.textContent = region;
    b.dataset.r = region;
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.region-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      activeRegion = region;
      // clear single-station selection and show all stations for region
      activeStation = null;
      renderStationsForRegion(region);
      // switch to Nivel de Ruido tab
      document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
      document.querySelector('[data-tab="ruido"]').classList.add('active');
      document.getElementById('tab-ruido').classList.add('active');
      renderChart();
    });
    rEl.appendChild(b);
  });
}

function renderStationsForRegion(region) {
  const sEl = document.getElementById('stations');
  sEl.innerHTML = '';
  const filtered = region ? annualData.filter(d => d.Region === region) : annualData;
  const uniq = [...new Set(filtered.map(d=>d.Estacion))].sort();
  stationMeta = uniq.map((id, i) => {
    // pick latest year value if present
    const rows = filtered.filter(r=>r.Estacion===id);
    const years = rows.map(r=>Number(r.Anio || 0)).filter(Boolean);
    let val = null;
    if (years.length) {
      const maxY = Math.max(...years);
      const found = rows.find(r=>Number(r.Anio)===maxY);
      val = found ? parseFloat((found.Ruido_dB||'0').toString().replace(',','.')) : null;
    }
    const color = COLORS[i % COLORS.length];
    return { id, val: val===null?50:Math.round((val||50)), color };
  });
  activeStations = new Set(stationMeta.map(s=>s.id));
  stationMeta.forEach(s=>{
    const b = document.createElement('button');
    b.className = 'station-btn active';
    b.textContent = s.id;
    b.dataset.sid = s.id;
    b.addEventListener('click', ()=>{
      // select this station exclusively
      activeStation = s.id;
      activeStations = new Set([s.id]);
      // update button visuals
      document.querySelectorAll('.station-btn').forEach(btn=>btn.classList.remove('active'));
      b.classList.add('active');
      // update both charts: bar chart for station and hourly profile
      renderChart();
      renderStationView(s.id);
    });
    sEl.appendChild(b);
  });
}

function showHourlyPlaceholder(stationId){
  const el = document.getElementById('tab-horario');
  el.innerHTML = `<div class="hourly-placeholder">Perfil Horario — estación <strong>${stationId}</strong> (datos disponibles)</div>`;
}

// Render hourly Plotly chart for a station (borrowed behaviour from index.html)
const YEAR_COLORS = ['#00429d', '#3e67ae', '#618fbf', '#85b7ce', '#b1dfdb', '#ffffe0'];
function renderStationView(stationName) {
  const el = document.getElementById('tab-horario');
  el.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:6px;">
      <h3 style="margin:0;font-weight:600">Perfil Horario: ${stationName}</h3>
      <div style="font-size:13px;color:#6b7280">Nivel de ruido promedio hora a hora · todos los años disponibles</div>
      <div id="hourly-chart" style="width:100%;height:320px;margin-top:6px"></div>
    </div>
  `;

  // Filter hourly data
  const stationHourlyData = hourlyData.filter(item => item.Estacion === stationName);
  const years = [...new Set(stationHourlyData.map(item => item.Anio))].sort();
  const ALL_HOURS = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0') + ':00');

  const traces = years.map((year, idx) => {
    const yearData = stationHourlyData.filter(item => item.Anio === year);
    const yValues = ALL_HOURS.map(hora => {
      const found = yearData.find(item => item.Hora === hora);
      return found ? parseFloat(found.Ruido_dB) : null;
    });
    const color = YEAR_COLORS[idx % YEAR_COLORS.length] || COLORS[idx % COLORS.length];
    return {
      x: ALL_HOURS,
      y: yValues,
      name: `${year}`,
      type: 'scatter',
      mode: 'lines+markers',
      connectgaps: false,
      line: { shape: 'spline', width: 2.5, color },
      marker: { size: 5, color, symbol: 'circle' },
      hovertemplate: `<b>${year}</b> · %{x}<br>Ruido: <b>%{y:.1f} dB</b><extra></extra>`
    };
  });

  const allValues = traces.flatMap(t => t.y).filter(v => v !== null);
  const minY = allValues.length ? Math.floor(Math.min(...allValues)) - 3 : 30;
  const maxY = allValues.length ? Math.ceil(Math.max(...allValues)) + 3 : 85;

  const shapes = [
    { type: 'rect', x0: '00:00', x1: '07:00', y0: 0, y1: 1, yref: 'paper', fillcolor: 'rgba(30,58,138,0.04)', line: { width: 0 } },
    { type: 'rect', x0: '07:00', x1: '21:00', y0: 0, y1: 1, yref: 'paper', fillcolor: 'rgba(251,191,36,0.05)', line: { width: 0 } },
    { type: 'rect', x0: '21:00', x1: '22:00', y0: 0, y1: 1, yref: 'paper', fillcolor: 'rgba(255,215,0,0.2)', line: { width: 0 } },
    { type: 'rect', x0: '22:00', x1: '23:00', y0: 0, y1: 1, yref: 'paper', fillcolor: 'rgba(30,58,138,0.04)', line: { width: 0 } }
  ];

  const annotations = [
    { x: '03:00', y: 1, yref: 'paper', text: '🌙 Noche', showarrow: false, font: { size: 10, color: '#94a3b8' }, xanchor: 'center', yanchor: 'bottom' },
    { x: '12:00', y: 1, yref: 'paper', text: '☀️ Día', showarrow: false, font: { size: 10, color: '#94a3b8' }, xanchor: 'center', yanchor: 'bottom' },
    { x: '22:00', y: 1, yref: 'paper', text: '🌇 Tarde', showarrow: false, font: { size: 10, color: '#94a3b8' }, xanchor: 'center', yanchor: 'bottom' }
  ];

  const layout = {
    margin: { t: 20, r: 20, l: 50, b: 60 },
    autosize: true,
    shapes,
    annotations,
    xaxis: { title: 'Hora del día', categoryorder: 'array', categoryarray: ALL_HOURS, tickangle: -90, tickfont: { size: 10 }, gridcolor: '#f1f5f9', showline: true, linecolor: '#e2e8f0' },
    yaxis: { title: 'Nivel de Ruido, dBA', gridcolor: '#e2e8f0', zeroline: false, range: [Math.max(30, minY), Math.min(100, maxY)] },
    paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)', hovermode: 'x unified', legend: { orientation: 'h', y: -0.2 }
  };

  const config = { responsive: true, displayModeBar: false };
  Plotly.newPlot('hourly-chart', traces, layout, config);
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
    // when opening Perfil Horario, decide what to render
    if (btn.dataset.tab === 'horario') {
      if (activeStation) {
        renderStationView(activeStation);
      } else if (activeRegion) {
        renderRegionHourly(activeRegion);
      } else {
        // default placeholder
        const el = document.getElementById('tab-horario');
        el.innerHTML = `<div class="hourly-placeholder">Perfil Horario — selecciona una estación o región</div>`;
      }
    }
  });
});

// Render hourly profile aggregated for a region for the last available year
function renderRegionHourly(regionName) {
  const el = document.getElementById('tab-horario');
  el.innerHTML = `<div style="display:flex;flex-direction:column;gap:6px;"><h3 style="margin:0;font-weight:600">Perfil Horario: ${regionName} (último año)</h3><div style="font-size:13px;color:#6b7280">Perfil horario promedio por hora · último año disponible</div><div id="hourly-chart" style="width:100%;height:320px;margin-top:6px"></div></div>`;

  // stations in region
  const regionStations = [...new Set(annualData.filter(d=>d.Region===regionName).map(d=>d.Estacion))];
  // determine last year available in hourlyData for these stations
  const years = [...new Set(hourlyData.filter(d=>regionStations.includes(d.Estacion)).map(d=>Number(d.Anio)))].filter(Boolean).sort();
  if (!years.length) {
    document.getElementById('hourly-chart').innerHTML = '<div class="hourly-placeholder">No hay datos horarios para esta región.</div>';
    return;
  }
  const lastYear = years[years.length-1];
  const ALL_HOURS = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0') + ':00');

  // For the lastYear, plot each station as a separate line
  const traces = regionStations.map((st, idx) => {
    const stationData = hourlyData.filter(d => d.Estacion === st && Number(d.Anio) === lastYear);
    const yValues = ALL_HOURS.map(hour => {
      const found = stationData.find(d => d.Hora === hour);
      return found ? parseFloat(found.Ruido_dB) : null;
    });
    const color = COLORS[idx % COLORS.length];
    return {
      x: ALL_HOURS,
      y: yValues,
      name: st,
      type: 'scatter',
      mode: 'lines+markers',
      connectgaps: false,
      line: { shape: 'spline', width: 2.2, color },
      marker: { size: 4, color }
    };
  });

  const layout = { margin: { t: 10, r: 20, l: 50, b: 60 }, xaxis: { tickangle: -90 }, yaxis: { title: 'Nivel de Ruido, dBA' }, paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)', legend: { orientation: 'h', y: -0.2 } };
  Plotly.newPlot('hourly-chart', traces, layout, { responsive: true, displayModeBar: false });
}

function renderChart(){
  const wrap = document.getElementById('bars-wrap');
  wrap.querySelectorAll('.bar-col').forEach(x=>x.remove());
  const leg = document.getElementById('legend');
  leg.innerHTML = '';

  // Mode: single station selected -> show bars per year for that station
  if (activeStation) {
    const rows = annualData.filter(d => d.Estacion === activeStation);
    const years = [...new Set(rows.map(r => r.Anio))].sort();
    if (!years.length) return;
    const valuesByYear = years.map(y => {
      const found = rows.find(r => r.Anio === y);
      return { year: y, val: found ? parseFloat((found.Ruido_dB||'0').toString().replace(',', '.')) : null };
    });

    // legend: years
    valuesByYear.forEach((yv, i) => {
      const d = document.createElement('div'); d.className='legend-item';
      const color = COLORS[i % COLORS.length];
      d.innerHTML = `<span class="legend-dot" style="background:${color}"></span>${yv.year}`;
      leg.appendChild(d);
    });

    const maxVal = Math.max(...valuesByYear.map(v=>v.val||0), 80);
    const chartH = 200;
    const yAxis = document.getElementById('y-axis');
    yAxis.innerHTML = '';
    const steps = [80,70,60,50,40];
    steps.forEach(v=>{ const l = document.createElement('div'); l.className='y-label'; l.textContent=v; yAxis.appendChild(l); });

    valuesByYear.forEach((yv, idx) => {
      const val = yv.val === null ? 0 : Math.round(yv.val);
      const barH = Math.round(((val - 40) / (maxVal - 36 || 1)) * chartH);
      const color = COLORS[idx % COLORS.length];
      const col = document.createElement('div'); col.className='bar-col';
      col.innerHTML = `
        <div class="bar" style="height:${barH}px;background:${color};">
          <span class="bar-val" style="color:${color}">${val}</span>
        </div>
        <div class="bar-label">${yv.year}</div>
      `;
      wrap.appendChild(col);
    });

    // Title handled in layout (no DOM title in this template)
    return;
  }

  // Default / regional view: bars per station using last available year value (stationMeta)
  const visible = stationMeta.filter(s=>activeStations.has(s.id));
  if (!visible.length) return;
  const maxVal = Math.max(...visible.map(s=>s.val), 80);
  const chartH = 200;

  visible.forEach(s=>{
    const d = document.createElement('div'); d.className='legend-item';
    d.innerHTML = `<span class="legend-dot" style="background:${s.color}"></span>${s.id}`;
    leg.appendChild(d);
  });

  const yAxis = document.getElementById('y-axis');
  yAxis.innerHTML = '';
  const steps = [80,70,60,50,40];
  steps.forEach(v=>{ const l = document.createElement('div'); l.className='y-label'; l.textContent=v; yAxis.appendChild(l); });

  visible.forEach(s=>{
    const barH = Math.round(((s.val - 40) / (maxVal - 36 || 1)) * chartH);
    const col = document.createElement('div'); col.className='bar-col';
    col.innerHTML = `
      <div class="bar" style="height:${barH}px;background:${s.color};">
        <span class="bar-val" style="color:${s.color}">${s.val}</span>
      </div>
      <div class="bar-label">${s.id}</div>
    `;
    wrap.appendChild(col);
  });

  // Title handled in layout (no DOM title in this template)
}

// iniciar carga
loadData();
</script>
</body>
