<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red Monitoreo de Ruido Ambiental</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>

<body class="bg-gray-100">

  <div class="p-2 bg-[#f5f4ee] rounded-xl min-h-[600px]">

    <!-- Encabezado -->
    <div class="flex justify-between items-start mb-2">
      <div>
        <h2 class="text-[17px] font-semibold text-gray-800 mb-0.5">Red de Monitoreo de Ruido Ambiental</h2>
        <p class="text-[15px] font-semibold text-gray-800">Ministerio del Medio Ambiente</p>
      </div>
      <div class="text-right">
        <p class="text-[13px] font-semibold text-gray-800 leading-relaxed">
          Sección Ruido<br>Departamento de Ruido, Lumínica y Olores
        </p>
      </div>
    </div>

    <!-- Botones de Región -->
    <div id="regions" class="flex flex-wrap gap-2.5 mb-2"></div>

    <!-- Botones de Estación -->
    <div id="stations" class="grid grid-cols-7 gap-1 mb-2 min-h-[100px]"></div>

    <!-- Pestañas -->
    <div class="flex pt-2">
      <button class="tab-btn px-4 py-1 text-[12px] font-medium rounded-t-md mr-1 bg-[#2c2c2a] text-white" data-tab="ruido">
        Nivel de Ruido
      </button>
      <button class="tab-btn px-4 py-1 text-[12px] font-medium rounded-t-md mr-1 bg-[#d1cfc6] text-[#5f5e5a] hover:bg-[#b4b2a9] transition-colors" data-tab="horario">
        Perfil Horario
      </button>
      <button class="tab-btn hidden px-4 py-1 text-[12px] font-medium rounded-t-md mr-1 bg-[#d1cfc6] text-[#5f5e5a] hover:bg-[#b4b2a9] transition-colors" data-tab="tiempo-real">
        Tiempo Real
      </button>
    </div>

    <!-- Área de gráficos -->
    <div class="bg-[#fff] p-2">
      <div id="tab-ruido" class="tab-content block">
        <div id="ruido-chart" style="width:100%; height:350px;"></div>
      </div>
      <div id="tab-horario" class="tab-content hidden">
        <div class="flex items-center justify-center h-[200px] text-sm text-gray-400">
          Perfil Horario - selecciona una estación para ver su tendencia
        </div>
      </div>
      <div id="tab-tiempo-real" class="tab-content hidden">
        <div class="flex items-center justify-center h-[200px] text-sm text-gray-400">
          Seleccione una estación
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="js/app.js"></script>

</body>
</html>
